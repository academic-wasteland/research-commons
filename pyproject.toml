[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "research-commons-conformance"
version = "0.1.0"
description = "Conformance tooling for Research Commons semantic contracts"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "jsonschema[format-nongpl]>=4.23,<5",
  "pyshacl>=0.30,<1",
  "rdflib>=7.1,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
research-commons = "research_commons.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_commons"]

[tool.hatch.build.targets.wheel.force-include]
"spec" = "research_commons/spec"

[tool.pytest.ini_options]
testpaths = ["tests"]
